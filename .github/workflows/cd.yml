# ============================================================================
# landing1 (cixio.com) — CD Pipeline
# ============================================================================
# Calls the centralized reusable CD workflow from cixio-enterprise-iac.
#
# Deployment: OIDC → ECR (build) → SSM Run Command (deploy to EC2)
# No SSH keys. No open ports. No long-lived credentials.
# ============================================================================

name: CD Pipeline

on:
  push:
    branches: [main, dev, develop, testing, test, qa, stage, staging, "feature/*", "fix/*", "hotfix/*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  deploy:
    uses: cixio-infrastructure/cixio-enterprise-iac/.github/workflows/reusable-cd.yml@main
    with:
      app-name: landing1
      image-name: cixio-com/landing1
      prod-port: "5001"
      runtime: node
      node-version: "20"
      container-port: "80"
      health-path: /api/health
    secrets: inherit
