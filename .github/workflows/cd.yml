# ============================================================================
# landing1 (cixio.com) — CD Pipeline
# ============================================================================
# Calls the centralized reusable CD workflow from cixio-enterprise-iac.
# Zero secrets needed — uses OIDC for AWS, GITHUB_TOKEN for GHCR,
# and runner-local SSH key on the build server.
# ============================================================================

name: CD Pipeline

on:
  push:
    branches: [main, dev, develop, testing, test, qa, stage, staging, "feature/*", "fix/*", "hotfix/*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: write
  packages: write
  pull-requests: write

jobs:
  deploy:
    uses: cixio-infrastructure/cixio-enterprise-iac/.github/workflows/reusable-cd.yml@main
    with:
      app-name: landing1
      image-name: cixio-com/landing1
      prod-port: "5001"
      runtime: node
      node-version: "20"
      container-port: "80"
      health-path: /api/health
      ec2-jump-host: "13.233.11.147"
    secrets: inherit
