
services:
  # ---------------------------------------------------------------
  # CIXIO.COM Application Service
  # 
  # Works for all environments (Development, Stage, Production)
  # Environment-specific behavior controlled by .env file:
  #   - NODE_ENV: development | staging | production
  #   - MONGODB_URI: Points to appropriate MongoDB instance
  #
  # Build vs Pre-built Image:
  #   - Development: Uses build context (builds on local machine)
  #   - Stage/Production: Uses pre-built image loaded from tar file
  #   - The build section is ignored if image already exists
  # ---------------------------------------------------------------

  # Node.js Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cixio-com-app:latest
    container_name: cixio-com-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      MONGODB_URI: ${MONGODB_URI}
    ports:
      - "5001:80"  # Multi-app deployment: unique host port
    volumes:
      - ./uploads:/app/uploads
    networks:
      - cixio-com-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:80/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Networks
networks:
  cixio-com-network:
    driver: bridge
  # Note: cixio-shared-db network removed from default config
  # For Production server with local MongoDB, manually add to app networks:
  #   - cixio-shared-db (external network)

# Volumes
volumes: {}
