
services:
  # MongoDB Service
  mongo:
    image: cixio-com-mongo:7.0
    container_name: cixio-com-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: changeme123
      MONGO_INITDB_DATABASE: cixio
    ports:
      - "127.0.0.1:27017:27017"  # Bind to localhost only - not exposed externally
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    networks:
      - cixio-com-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Node.js Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cixio-com-app:latest
    container_name: cixio-com-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:changeme123@mongo:27017/cixio?authSource=admin
    ports:
      - "5001:80"  # Multi-app deployment: unique host port
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - cixio-com-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:80/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Networks
networks:
  cixio-com-network:
    driver: bridge

# Volumes
volumes:
  mongo-data:
    driver: local
  mongo-config:
    driver: local
