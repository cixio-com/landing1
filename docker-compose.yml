
services:
  # ---------------------------------------------------------------
  # MongoDB Configuration:
  # 
  # PRODUCTION (Single EC2): Apps + DB on same machine
  #   → MONGODB_URI uses container names: cixio-mongo1:27017
  #   → Requires: cixio-shared-db Docker network (external)
  #   → Set USE_SHARED_DB_NETWORK=true in .env
  #
  # STAGE/DEV (Multi-EC2): DB on separate server
  #   → MONGODB_URI uses VPC private IP: 172.31.33.96:27017
  #   → Does NOT use cixio-shared-db network
  #   → Set USE_SHARED_DB_NETWORK=false in .env (or leave unset)
  # ---------------------------------------------------------------

  # Node.js Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cixio-com-app:latest
    container_name: cixio-com-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      MONGODB_URI: ${MONGODB_URI:-mongodb://${CIXIO_COM_DB_USER:-cixio_com_user}:${CIXIO_COM_DB_PASSWORD}@cixio-mongo1:27017,cixio-mongo2:27017,cixio-mongo3:27017/cixio?replicaSet=rs0&authSource=cixio}
    ports:
      - "5001:80"  # Multi-app deployment: unique host port
    volumes:
      - ./uploads:/app/uploads
    # Networks: conditionally include cixio-shared-db based on USE_SHARED_DB_NETWORK env var
    # For multi-server (Stage/Dev), only use cixio-com-network
    # For single-server (Production), use both networks
    networks:
      - cixio-com-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:80/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Networks
networks:
  cixio-com-network:
    driver: bridge
  # Note: cixio-shared-db network removed from default config
  # For Production server with local MongoDB, manually add to app networks:
  #   - cixio-shared-db (external network)

# Volumes
volumes: {}
