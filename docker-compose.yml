
services:
  # ---------------------------------------------------------------
  # NOTE: MongoDB removed - using central replica set
  # See: CIXIO-DATABASE/mvp_10_cixio-database
  #
  # SINGLE EC2: Apps + DB on same machine (via Docker network)
  #   → Uses default: cixio-mongo1:27017 (container names)
  #   → Requires: cixio-shared-db Docker network
  #
  # MULTI-EC2: DB on separate server (via VPC private IP)
  #   → Set MONGODB_URI in .env with DB server's private IP
  #   → cixio-shared-db network NOT needed (remove from networks below)
  # ---------------------------------------------------------------

  # Node.js Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cixio-com-app:latest
    container_name: cixio-com-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
<<<<<<< Updated upstream
      NODE_ENV: ${NODE_ENV:-production}
      MONGODB_URI: ${MONGODB_URI}
=======
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:-mongodb://${CIXIO_COM_DB_USER:-cixio_com_user}:${CIXIO_COM_DB_PASSWORD}@cixio-mongo1:27017,cixio-mongo2:27017,cixio-mongo3:27017/cixio?replicaSet=rs0&authSource=cixio}
    ports:
      - "5001:80"  # Multi-app deployment: unique host port
    volumes:
      - ./uploads:/app/uploads
    networks:
      - cixio-com-network
      - cixio-shared-db
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:80/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Networks
networks:
  cixio-com-network:
    driver: bridge
  cixio-shared-db:
    external: true
    name: cixio-shared-db

# Volumes
volumes: {}
